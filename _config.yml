title: Study Archive
description: 경제학과 컴퓨터과학을 오가며 쌓은 학부 학습 기록
lang: ko-KR
url: "https://saturn294571.github.io"
baseurl: "/study-archive"
repository: Saturn294571/study-archive
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
collections:
  notes:
    output: true
    permalink: /notes/:path/
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
exclude:
  - .agents
  - .codex
  - .vscode
  - Gemfile
  - Gemfile.lock
  - README.md
  - a4-50-50.css
  - a4-dark.css
  - a4-light.css
  - atom-one-dark.css
  - marp-a4
  - personal_record
  - scripts
  - templates
  - vendor
  - 연구
  - 일본 석사 프로젝트
