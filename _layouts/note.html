---
layout: default
---
<article class="note-layout">
  <aside class="note-meta">
    <a class="back-link" href="{{ '/courses/' | relative_url }}">← 모든 과목</a>
    <p class="eyebrow">{{ page.semester }} · {{ page.course }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.section %}<p class="section-label">{{ page.section }}</p>{% endif %}
    <div class="note-actions">
      <button class="toc-toggle" type="button">목차 보기</button>
      <a href="https://github.com/{{ site.repository }}/blob/main/{{ page.source_path }}">원문</a>
    </div>
    <nav class="toc" aria-label="문서 목차"></nav>
  </aside>
  <div class="prose">{{ content }}</div>
</article>
