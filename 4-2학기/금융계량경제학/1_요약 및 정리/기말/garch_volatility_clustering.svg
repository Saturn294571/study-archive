<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <rect width="980" height="560" fill="#ffffff"/>
  <style>
    .axis { stroke: #222; stroke-width: 1.4; }
    .grid { stroke: #e7e7e7; stroke-width: 1; }
    .ret { fill: none; stroke: #1f6f8b; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .vol { fill: none; stroke: #c45122; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .shade { fill: #f2b880; opacity: 0.25; }
    .label { font-family: Arial, sans-serif; fill: #222; font-size: 18px; }
    .small { font-family: Arial, sans-serif; fill: #444; font-size: 15px; }
    .note { font-family: Arial, sans-serif; fill: #333; font-size: 16px; font-weight: 600; }
    .tick { font-family: Arial, sans-serif; fill: #666; font-size: 13px; }
  </style>

  <text x="490" y="34" text-anchor="middle" class="label" font-weight="700">Volatility Clustering</text>
  <text x="490" y="58" text-anchor="middle" class="small">Large shocks tend to be followed by large shocks: conditional variance stays high for a while</text>

  <!-- panel backgrounds -->
  <rect x="85" y="86" width="825" height="205" fill="#fbfbfb" stroke="#dddddd"/>
  <rect x="85" y="342" width="825" height="130" fill="#fbfbfb" stroke="#dddddd"/>

  <!-- clustering windows -->
  <rect x="265" y="86" width="155" height="205" class="shade"/>
  <rect x="665" y="86" width="120" height="205" class="shade"/>
  <rect x="265" y="342" width="155" height="130" class="shade"/>
  <rect x="665" y="342" width="120" height="130" class="shade"/>

  <!-- grids -->
  <line x1="85" y1="188.5" x2="910" y2="188.5" class="grid"/>
  <line x1="85" y1="393" x2="910" y2="393" class="grid"/>
  <line x1="85" y1="438" x2="910" y2="438" class="grid"/>

  <!-- axes -->
  <line x1="85" y1="188.5" x2="910" y2="188.5" class="axis"/>
  <line x1="85" y1="86" x2="85" y2="291" class="axis"/>
  <line x1="85" y1="472" x2="910" y2="472" class="axis"/>
  <line x1="85" y1="342" x2="85" y2="472" class="axis"/>

  <!-- return series: calm, volatile cluster, calm, volatile cluster, calm -->
  <polyline class="ret" points="
    85,189 98,181 111,193 124,186 137,191 150,184 163,196 176,188 189,180 202,194
    215,187 228,192 241,183 254,190
    267,156 280,230 293,116 306,258 319,134 332,218 345,105 358,247 371,151 384,223
    397,126 410,238 423,178 436,192
    449,185 462,196 475,188 488,181 501,193 514,187 527,191 540,184 553,196 566,189
    579,182 592,194 605,187 618,191 631,185 644,190 657,181
    670,134 683,232 696,154 709,258 722,112 735,224 748,144 761,244 774,161 787,213
    800,184 813,191 826,186 839,195 852,188 865,182 878,193 891,186 904,190"/>

  <!-- conditional variance curve -->
  <polyline class="vol" points="
    85,455 105,454 125,454 145,453 165,454 185,455 205,454 225,453 245,454
    265,444 285,410 305,372 325,358 345,356 365,365 385,388 405,415 425,437
    445,448 465,453 485,454 505,455 525,454 545,453 565,454 585,455 605,454 625,453 645,454
    665,440 685,398 705,361 725,352 745,358 765,382 785,421 805,443
    825,452 845,455 865,454 885,453 905,454"/>

  <!-- labels -->
  <text x="40" y="193" text-anchor="middle" class="small" transform="rotate(-90 40 193)">return shock ε_t</text>
  <text x="40" y="415" text-anchor="middle" class="small" transform="rotate(-90 40 415)">conditional variance σ²_t</text>
  <text x="910" y="314" text-anchor="end" class="tick">time</text>
  <text x="910" y="496" text-anchor="end" class="tick">time</text>

  <text x="342" y="112" text-anchor="middle" class="note">high-vol cluster</text>
  <text x="725" y="112" text-anchor="middle" class="note">high-vol cluster</text>
  <text x="510" y="525" text-anchor="middle" class="small">GARCH: sigma_t^2 = omega + alpha*epsilon_{t-1}^2 + beta*sigma_{t-1}^2 : shock size + past variance create persistence</text>
</svg>
