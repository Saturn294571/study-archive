<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <rect width="980" height="560" fill="#ffffff"/>
  <style>
    .axis { stroke: #222; stroke-width: 1.4; }
    .grid { stroke: #e8e8e8; stroke-width: 1; }
    .normal { fill: none; stroke: #5b6770; stroke-width: 3; stroke-dasharray: 9 7; }
    .mixture { fill: none; stroke: #c45122; stroke-width: 3.4; }
    .low { fill: none; stroke: #1f6f8b; stroke-width: 2.2; opacity: 0.75; }
    .high { fill: none; stroke: #7b4dbb; stroke-width: 2.2; opacity: 0.75; }
    .tail { fill: #f2b880; opacity: 0.35; }
    .label { font-family: Arial, sans-serif; fill: #222; font-size: 19px; }
    .small { font-family: Arial, sans-serif; fill: #444; font-size: 15px; }
    .note { font-family: Arial, sans-serif; fill: #333; font-size: 16px; font-weight: 600; }
    .legend { font-family: Arial, sans-serif; fill: #333; font-size: 14px; }
  </style>

  <text x="490" y="34" text-anchor="middle" class="label" font-weight="700">Fat Tail from Time-Varying Volatility</text>
  <text x="490" y="58" text-anchor="middle" class="small">Conditional normal distributions with different variances can create a fat-tailed unconditional distribution</text>

  <rect x="90" y="92" width="800" height="360" fill="#fbfbfb" stroke="#dddddd"/>
  <line x1="90" y1="452" x2="890" y2="452" class="axis"/>
  <line x1="490" y1="92" x2="490" y2="452" class="grid"/>
  <line x1="90" y1="372" x2="890" y2="372" class="grid"/>
  <line x1="90" y1="292" x2="890" y2="292" class="grid"/>
  <line x1="90" y1="212" x2="890" y2="212" class="grid"/>

  <!-- tail regions -->
  <rect x="90" y="92" width="115" height="360" class="tail"/>
  <rect x="775" y="92" width="115" height="360" class="tail"/>

  <!-- low-vol conditional normal: narrow peak -->
  <path class="low" d="
    M 170 452
    C 250 452, 310 450, 360 425
    C 410 385, 435 280, 455 180
    C 470 110, 510 110, 525 180
    C 545 280, 570 385, 620 425
    C 670 450, 730 452, 810 452"/>

  <!-- high-vol conditional normal: wide low curve -->
  <path class="high" d="
    M 90 447
    C 175 435, 250 390, 330 330
    C 405 275, 455 245, 490 240
    C 525 245, 575 275, 650 330
    C 730 390, 805 435, 890 447"/>

  <!-- normal with same unconditional variance: thinner tails, higher center than mixture around middle -->
  <path class="normal" d="
    M 90 452
    C 180 451, 260 440, 330 390
    C 395 335, 440 240, 465 165
    C 480 120, 500 120, 515 165
    C 540 240, 585 335, 650 390
    C 720 440, 800 451, 890 452"/>

  <!-- unconditional mixture: sharper center and heavier tails -->
  <path class="mixture" d="
    M 90 438
    C 160 426, 225 405, 300 360
    C 365 320, 420 245, 455 150
    C 472 105, 508 105, 525 150
    C 560 245, 615 320, 680 360
    C 755 405, 820 426, 890 438"/>

  <!-- labels and callouts -->
  <text x="490" y="482" text-anchor="middle" class="small">return shock epsilon_t</text>
  <text x="145" y="122" text-anchor="middle" class="note">extreme losses</text>
  <text x="835" y="122" text-anchor="middle" class="note">extreme gains</text>
  <text x="490" y="92" text-anchor="middle" class="small">center: many calm days</text>
  <text x="490" y="520" text-anchor="middle" class="small">GARCH intuition: low-vol days + high-vol days mixed together -> more observations near zero and in the tails</text>

  <!-- legend -->
  <line x1="650" y1="132" x2="710" y2="132" class="mixture"/>
  <text x="720" y="137" class="legend">unconditional mixture: fat tail</text>
  <line x1="650" y1="158" x2="710" y2="158" class="normal"/>
  <text x="720" y="163" class="legend">single normal: thin tail</text>
  <line x1="650" y1="184" x2="710" y2="184" class="low"/>
  <text x="720" y="189" class="legend">low-vol conditional normal</text>
  <line x1="650" y1="210" x2="710" y2="210" class="high"/>
  <text x="720" y="215" class="legend">high-vol conditional normal</text>
</svg>
